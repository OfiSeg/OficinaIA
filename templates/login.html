<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso · OficinaIA</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{url_for('static',filename='css/login.css')}}"></head><body><main><section><div class="brand"><b>✦</b><span><strong>OficinaIA</strong><small>Asistente Oficina</small></span></div><span class="eyebrow">ACCESO PRIVADO</span><h1>Bienvenido de nuevo</h1><p>Ingresá para consultar la información de tu oficina.</p><form method="POST"><label>Usuario<input name="usuario" autocomplete="username" required autofocus placeholder="Ingresá tu usuario"></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" required placeholder="Ingresá tu contraseña"></label>{%if error%}<div class="error">{{error}}</div>{%endif%}<button>Iniciar sesión <span>→</span></button></form><small class="security">● Sistema privado · Acceso autorizado únicamente</small></section></main></body></html>
