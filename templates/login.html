<!doctype html>
<html lang="es">
<head>
  <script>
  (()=>{try{const stored=localStorage.getItem('oficinaia_theme');const theme=(stored==='light'||stored==='dark')?stored:(window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',theme);document.documentElement.style.colorScheme=theme}catch(_){}})();
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Acceso · {{config_global.nombre_oficina}}</title>
  <link rel="icon" type="image/png" href="{{ static_asset('img/favicon.png') }}">
  <link rel="stylesheet" href="{{ static_asset('css/login.css') }}">
</head>
<body>
  <main class="login-page">
    <section class="login-shell" aria-labelledby="loginTitle">
      <div class="login-brand-panel">
        <div class="login-brand">
          <span class="login-brand-icon"><img src="{{ static_asset('img/favicon.png') }}" alt=""></span>
          <div><strong>{{config_global.nombre_oficina}}</strong><small>OficinaIA</small></div>
        </div>
        <div class="login-brand-copy">
          <h1 id="loginTitle">Tu oficina, en un solo lugar.</h1>
          <p>Cartera, documentación, cotizaciones y herramientas internas en un mismo lugar.</p>
        </div>
      </div>

      <div class="login-form-panel">
        <div class="login-form-head">
          <h2>Iniciar sesión</h2>
        </div>
        <form method="POST" class="login-form">
          <label for="loginUsuario">Usuario</label>
          <input id="loginUsuario" name="usuario" autocomplete="username" required autofocus placeholder="Ingresá tu usuario">

          <label for="loginPassword">Contraseña</label>
          <input id="loginPassword" name="password" type="password" autocomplete="current-password" required placeholder="Ingresá tu contraseña">

          {% if error %}<div class="login-error" role="alert">{{error}}</div>{% endif %}
          <button type="submit" class="login-submit">Iniciar sesión <span aria-hidden="true">→</span></button>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
