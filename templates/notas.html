<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Bloc de notas</title>

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/estilo.css') }}"
>

</head>


<body>


<div class="app">


<aside class="sidebar">


<div class="brand">

<div class="brand-logo">
OS
</div>

<div>

<div class="brand-name">
Oficina Seguros
</div>

<div class="brand-subtitle">
Panel de trabajo
</div>

</div>

</div>


<nav class="navigation">


<a
    href="{{ url_for('documentos') }}"
    class="nav-item"
>

<span>⌂</span>

Inicio

</a>


<a
    href="{{ url_for('buscar') }}"
    class="nav-item"
>

<span>⌕</span>

Buscador

<kbd>F3</kbd>

</a>


<a
    href="{{ url_for('notas') }}"
    class="nav-item active"
>

<span>□</span>

Bloc de notas

</a>


</nav>


</aside>


<main class="main">


<header class="topbar">


<div>

<div class="page-title">
Bloc de notas
</div>

<div class="page-subtitle">
Notas y recordatorios
</div>

</div>


<div
    id="estadoGuardado"
    style="
        color:#4d8e69;
        font-size:10px;
    "
>

Guardado

</div>


</header>


<div style="
    flex:1;
    padding:25px;
    overflow:hidden;
">


<textarea
    id="editorNotas"
    spellcheck="false"
    placeholder="Escribí tus notas, recordatorios, teléfonos, pendientes..."
    style="
        width:100%;
        height:100%;
        resize:none;
        padding:25px;
        border:1px solid #e3e7eb;
        border-radius:12px;
        background:white;
        outline:none;
        font-family:'Segoe UI',Arial,sans-serif;
        font-size:13px;
        line-height:1.7;
    "
>{{ contenido }}</textarea>


</div>


</main>


</div>


<script>


const editor =
    document.getElementById(
        "editorNotas"
    );


const estado =
    document.getElementById(
        "estadoGuardado"
    );


let temporizador;


async function guardarNotas() {


    estado.textContent =
        "Guardando...";


    estado.style.color =
        "#9a7b38";


    try {


        const response =
            await fetch(
                "/api/notas",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            contenido:
                                editor.value

                        })

                }
            );


        const data =
            await response.json();


        if (data.ok) {

            estado.textContent =
                "✓ Guardado";

            estado.style.color =
                "#4d8e69";

        } else {

            estado.textContent =
                "Error al guardar";

            estado.style.color =
                "#c24141";

        }


    } catch (error) {

        estado.textContent =
            "Error de conexión";

        estado.style.color =
            "#c24141";

    }

}


editor.addEventListener(
    "input",
    () => {

        estado.textContent =
            "Cambios pendientes";

        estado.style.color =
            "#9a7b38";


        clearTimeout(
            temporizador
        );


        temporizador =
            setTimeout(
                guardarNotas,
                700
            );

    }
);


</script>


</body>

</html>
