{% extends 'base.html' %}{% block title %}Notas · OficinaIA{% endblock %}{% block content %}<div class="page"><header class="top"><div><span>ESPACIO PERSONAL</span><h1>Notas</h1><p>Recordatorios y apuntes rápidos.</p></div><strong class="saved" id="estadoGuardado">Guardado</strong></header><section class="panel notes"><div><b>Bloc de notas</b><small>El contenido se guarda automáticamente.</small></div><textarea id="editorNotas" placeholder="Escribí tus notas, recordatorios, teléfonos, pendientes...">{{contenido}}</textarea></section></div>{% endblock %}{% block scripts %}<script>const n=document.getElementById('editorNotas'),s=document.getElementById('estadoGuardado');let t;n.addEventListener('input',()=>{clearTimeout(t);s.textContent='Guardando...';t=setTimeout(async()=>{const r=await fetch('/api/notas',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contenido:n.value})}),d=await r.json();s.textContent=d.ok?'Guardado':'Error al guardar'},700)});</script>{% endblock %}
