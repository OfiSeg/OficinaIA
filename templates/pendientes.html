{% extends 'base.html' %}
{% block title %}Pendientes · {{config_global.nombre_oficina}}{% endblock %}
{% block content %}
<div class="page">
  <header class="top pendientes-head">
    <div><h1>Pendientes</h1><p>Seguimiento de tareas y gestiones que todavía requieren una acción.</p></div>
    <strong class="count" id="pendientesCount">—</strong>
  </header>
  <div class="pend-toolbar"><button type="button" class="primary" id="btnNuevoPendiente">+ Nuevo pendiente</button></div>

  <div class="pend-filters">
    <button type="button" class="pend-filter active" data-estado="pendiente">Pendientes</button>
    <button type="button" class="pend-filter" data-estado="hecho">Hechos</button>
    <button type="button" class="pend-filter" data-estado="descartado">Descartados</button>
  </div>

  <div id="pendientesLista" class="pend-list">
    <div class="empty"><b>Cargando…</b></div>
  </div>
</div>

<div class="modal" id="pendModal" hidden>
  <div>
    <button type="button" id="pendModalCerrar">×</button>
    <h2 id="pendModalTitulo">Nuevo pendiente</h2>
    <form id="pendForm">
      <input type="hidden" id="pendId">
      <label>Título
        <input id="pendTitulo" required maxlength="200" placeholder="Ej: llamar a Pérez por la póliza 12345">
      </label>
      <label>Tipo
        <select id="pendTipo">
          <option value="generico">Tarea</option>
          <option value="excel">Excel</option>
          <option value="flota">Flota</option>
          <option value="coti">Cotización</option>
          <option value="metadato">Metadato</option>
          <option value="whatsapp">WhatsApp</option>
          <option value="pdf_ficha">Ficha PDF</option>
        </select>
      </label>
      <label>Notas / contenido (opcional)
        <textarea id="pendContenido" rows="4" style="width:100%;margin-top:5px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:calc(11px * var(--font-scale,1));resize:vertical"></textarea>
      </label>
      <p id="pendModalError"></p>
      <button type="submit" class="primary" style="width:100%;height:40px;margin-top:6px">Guardar</button>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
(function(){
  let estadoActual='pendiente';
  let itemsActuales=[];
  const lista=document.getElementById('pendientesLista');
  const countEl=document.getElementById('pendientesCount');

  // Tanda 8 — modal de alta/edición manual, sin depender del chat.
  const modal=document.getElementById('pendModal');
  const modalTitulo=document.getElementById('pendModalTitulo');
  const modalError=document.getElementById('pendModalError');
  const form=document.getElementById('pendForm');
  const campoId=document.getElementById('pendId');
  const campoTitulo=document.getElementById('pendTitulo');
  const campoTipo=document.getElementById('pendTipo');
  const campoContenido=document.getElementById('pendContenido');

  function abrirModal({id='',titulo='',tipo='generico',contenido=''}={}){
    modalError.textContent='';
    campoId.value=id;
    campoTitulo.value=titulo;
    campoTipo.value=tipo||'generico';
    campoContenido.value=contenido||'';
    modalTitulo.textContent=id?'Editar pendiente':'Nuevo pendiente';
    modal.hidden=false;
    campoTitulo.focus();
  }
  function cerrarModal(){modal.hidden=true}

  document.getElementById('btnNuevoPendiente').addEventListener('click',()=>abrirModal());
  document.getElementById('pendModalCerrar').addEventListener('click',cerrarModal);
  modal.addEventListener('click',e=>{if(e.target===modal)cerrarModal()});

  form.addEventListener('submit',async e=>{
    e.preventDefault();
    const id=campoId.value;
    const titulo=campoTitulo.value.trim();
    const tipo=campoTipo.value;
    const contenido=campoContenido.value.trim();
    if(!titulo){modalError.textContent='Poné un título.';return}
    const payload=contenido?{contenido}:{};
    try{
      let r;
      if(id){
        r=await fetch('/api/pendientes/'+id,{
          method:'PATCH',
          headers:{'Content-Type':'application/json'},
          credentials:'same-origin',
          body:JSON.stringify({titulo,tipo,payload})
        });
      }else{
        r=await fetch('/api/pendientes',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          credentials:'same-origin',
          body:JSON.stringify({titulo,tipo,payload})
        });
      }
      const d=await r.json().catch(()=>({}));
      if(!r.ok||!d.ok){modalError.textContent=d.error||'No se pudo guardar.';return}
      cerrarModal();
      if(window.showToast)showToast(id?'Pendiente actualizado':'Pendiente creado','success');
      cargar();
    }catch(_){modalError.textContent='No se pudo guardar. Probá de nuevo.'}
  });

  const TIPO_LABEL={
    excel:'Excel',
    flota:'Flota',
    metadato:'Metadato',
    coti:'Cotización',
    whatsapp:'WhatsApp',
    pdf_ficha:'Ficha PDF',
    generico:'Tarea'
  };

  function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

  function fecha(v){
    if(!v)return '';
    try{
      const d=new Date(String(v).replace(' ','T')+'Z');
      if(Number.isNaN(d.getTime()))return v;
      return d.toLocaleString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
    }catch(_){return v}
  }

  async function cargar(){
    lista.innerHTML='<div class="empty"><b>Cargando…</b></div>';
    try{
      const r=await fetch('/api/pendientes?estado='+encodeURIComponent(estadoActual),{credentials:'same-origin'});
      const d=await r.json();
      if(!r.ok||!d.ok)throw Error(d.error||'Error');
      const items=d.pendientes||[];
      if(countEl)countEl.textContent=(d.total_pendientes??items.length)+' en cola';
      if(window.actualizarBadgePendientes)window.actualizarBadgePendientes(d.total_pendientes||0);
      if(!items.length){
        lista.innerHTML='<div class="empty"><b>Nada por aquí</b><small>Usá “Dejar pendiente” en una propuesta de Excel/flota, o confirmá cargas más tarde desde acá.</small></div>';
        return;
      }
      lista.innerHTML=items.map(item=>{
        const tipo=TIPO_LABEL[item.tipo]||item.tipo;
        const payload=item.payload||{};
        const preview=payload.preview||payload.texto||payload.contenido||'';
        const corto=String(preview).slice(0,180);
        return `<article class="pend-card" data-id="${item.id}">
          <header>
            <span class="pend-tag">${esc(tipo)}</span>
            <strong>${esc(item.titulo)}</strong>
            <small>${esc(fecha(item.actualizado_en||item.creado_en))}</small>
          </header>
          ${corto?`<p class="pend-preview">${esc(corto)}${String(preview).length>180?'…':''}</p>`:''}
          <div class="pend-actions">
            ${estadoActual==='pendiente'?`
              <button type="button" class="primary" data-act="hecho">Marcar hecho</button>
              <button type="button" class="secondary" data-act="descartado">Descartar</button>
            `:''}
            <button type="button" class="secondary" data-act="editar">Editar</button>
            ${payload.contenido||payload.texto?`<button type="button" class="secondary" data-act="copiar">Copiar texto</button>`:''}
            <button type="button" class="secondary danger-text" data-act="borrar">Eliminar</button>
          </div>
        </article>`;
      }).join('');
      itemsActuales=items;
    }catch(e){
      lista.innerHTML=`<div class="empty"><b>No se pudo cargar</b><small>${esc(e.message||'')}</small></div>`;
    }
  }

  document.querySelectorAll('.pend-filter').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.pend-filter').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      estadoActual=btn.dataset.estado;
      cargar();
    });
  });

  lista.addEventListener('click',async e=>{
    const btn=e.target.closest('button[data-act]');
    if(!btn)return;
    const card=btn.closest('.pend-card');
    if(!card)return;
    const id=card.dataset.id;
    const act=btn.dataset.act;
    if(act==='borrar'){
      if(!confirm('¿Eliminar este pendiente?'))return;
      const r=await fetch('/api/pendientes/'+id,{method:'DELETE',credentials:'same-origin'});
      const d=await r.json().catch(()=>({}));
      if(!r.ok){if(window.showToast)showToast(d.error||'Error','error');return}
      if(window.showToast)showToast('Eliminado','success');
      cargar();
      return;
    }
    if(act==='copiar'){
      try{
        const item=itemsActuales.find(x=>String(x.id)===String(id));
        const texto=(item&&item.payload&&(item.payload.contenido||item.payload.texto||item.payload.preview))||'';
        await navigator.clipboard.writeText(String(texto));
        if(window.showToast)showToast('Texto copiado','success');
      }catch(_){if(window.showToast)showToast('No se pudo copiar','error')}
      return;
    }
    if(act==='editar'){
      const item=itemsActuales.find(x=>String(x.id)===String(id));
      if(!item)return;
      const payload=item.payload||{};
      abrirModal({
        id:item.id,
        titulo:item.titulo,
        tipo:item.tipo,
        contenido:payload.contenido||payload.texto||''
      });
      return;
    }
    if(act==='hecho'||act==='descartado'){
      btn.disabled=true;
      const r=await fetch('/api/pendientes/'+id,{
        method:'PATCH',
        headers:{'Content-Type':'application/json'},
        credentials:'same-origin',
        body:JSON.stringify({estado:act})
      });
      const d=await r.json().catch(()=>({}));
      if(!r.ok){if(window.showToast)showToast(d.error||'Error','error');btn.disabled=false;return}
      if(window.showToast)showToast(act==='hecho'?'Marcado como hecho':'Descartado','success');
      cargar();
    }
  });

  cargar();
})();
</script>
{% endblock %}
